services:
  postgres_db:
    image: postgres:15
    container_name: checkpoint_postgres
    restart: always
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      retries: 5
      start_period: 10s

  backend:
    build: .
    container_name: checkpoint_backend
    env_file:
      - .env
    environment:
      DB_URL: jdbc:postgresql://postgres_db:5432/${POSTGRES_DB}
      PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      postgres_db:
        condition: service_healthy

volumes:
  postgres_data:
